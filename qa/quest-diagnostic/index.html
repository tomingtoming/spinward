<h1>Spinward — VR起動の切り分け</h1>
<p>都市を読み込まず、床と青い箱だけでVRを開始します。本編と同じ描画エンジン・開始ボタンを使います。</p>
<p>「ENTER VR」を1回押してください。入れた場合は約10秒で自動的に戻ります。</p>
<p id="previous">前回の記録を確認中…</p>
<div id="view"></div>
<div id="entry"></div>
<p id="status" role="status">準備中…</p>
<p class="note">ブラウザが終了した場合は、このページを開き直すと最後の段階を表示します。記録はこの端末に保存します。手動でタブを閉じた場合も未完了になるので、記録だけではクラッシュと断定しません。</p>
